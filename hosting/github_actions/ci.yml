# GitHub Actions workflow for the Semantic Search & Recommender.
#
# What this does: every time you push code or open a pull request, GitHub spins up
# a fresh Linux machine, installs Python and your dependencies, and runs your tests.
# If the tests pass you get a green checkmark; if they fail, a red X and a log to read.
# It's free on public repos.
#
# The nice part for THIS project -- and it's rare for an "AI project": the tests run
# OFFLINE. The search engine uses a from-scratch TF-IDF embedder (plain numpy maths),
# not a hosted model, so pytest never calls a real LLM and never touches the internet.
# CI needs NO API key and NO secrets at all -- nothing to leak, nothing to configure.
# All 23 tests pass on a clean machine, free, on every single push -- including the ones
# that check search, filters, ranking, and the A/B test that measures which ranker wins.
# The ONE thing CI installs is numpy, and that's a real dependency already listed in
# requirements.txt, so a single pip install covers it.
#
# WHERE THIS FILE GOES: copy it to ".github/workflows/ci.yml" at the ROOT of your repo.
# Here the repo root is the whole project folder (21-semantic-search-recommender), so the
# real code sits one level down in build_from_scratch/. GitHub only runs workflow files
# that live under .github/workflows/.

# The name shown in the repo's "Actions" tab.
name: CI

# "on" decides WHEN this runs. Here: on every push, and on every pull request.
on:
  push:
  pull_request:

# A workflow is made of one or more "jobs". We have one job, called "test".
jobs:
  test:
    # The kind of machine to run on. ubuntu-latest is a standard, free Linux box.
    # Your tests are pure Python, so they pass on Linux even though you develop on Windows.
    runs-on: ubuntu-latest

    # "steps" run top to bottom on that machine.
    steps:
      # Step 1: download your repo's code onto the runner. Without this, the machine
      # is empty and has nothing to test. "uses" pulls in a prebuilt, official action.
      - name: Check out the code
        uses: actions/checkout@v4

      # Step 2: install Python. Pin a version so CI matches what you develop against.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip downloads between runs so installs are faster.
          cache: pip
          # Tell the cache where the dependency list lives (it's not at the repo root).
          cache-dependency-path: build_from_scratch/requirements.txt

      # Step 3: install the project's dependencies. requirements.txt lives inside
      # build_from_scratch/, so we point pip at it explicitly. "--upgrade pip" just
      # makes sure pip itself is current first. This installs numpy (the one real
      # core dependency the tests need) plus pytest. litellm and streamlit are listed
      # in there too and install fine -- they're only actually USED with the optional
      # --explain flag or the web app, which CI never asks for. sentence-transformers
      # is commented out on purpose (it pulls in heavy torch), so CI stays fast.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build_from_scratch/requirements.txt

      # Step 4: run the tests. We "cd" into build_from_scratch first with
      # working-directory, because that's where pyproject.toml and the tests/ folder
      # are. pyproject.toml already tells pytest where the tests live
      # (testpaths = ["tests"]) and how to find the package (pythonpath = ["."]), so a
      # bare "pytest" from that folder finds and runs the whole suite -- all 23 tests,
      # offline, no API key, no secrets. The job passes only if every one of them passes.
      - name: Run tests
        working-directory: build_from_scratch
        run: pytest
